name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Fresh checkouts have no keystore.properties; release signing is skipped without it.
      - name: Lint, unit tests, debug build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
      - name: Release build (R8) compiles
        run: ./gradlew assembleRelease
